# Separate virtual host: preserve other sites and their existing listeners.
server {
    listen 80;
    listen [::]:80;
    server_name sellerpro.org;
    location /.well-known/acme-challenge/ { root /var/www/sellerpro-acme; }
    location / { return 301 https://sellerpro.org$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sellerpro.org;
    ssl_certificate /etc/letsencrypt/live/sellerpro.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sellerpro.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 12m;
    location /api/ {
        proxy_pass http://127.0.0.1:14000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }
}
